<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Personal Expense Tracker & Budget Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-2" style="background: var(--primary-light); color: var(--primary); width: 56px; height: 56px; font-size: 1.8rem;">
          <i class="bi bi-wallet2"></i>
        </div>
        <h3 class="fw-bold mb-1">ExpenseTracker Pro</h3>
        <p class="text-muted small">Personal Expense Tracker & Budget Management System</p>
        <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-1">College Field Project</span>
      </div>

      <!-- Nav Tabs -->
      <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-3" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">
            <i class="bi bi-person-plus"></i> Register
          </button>
        </li>
      </ul>

      <!-- Alerts -->
      <div id="authAlert" class="alert d-none" role="alert"></div>

      <div class="tab-content" id="authTabContent">
        <!-- Sign In Form -->
        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
          <form id="loginForm">
            <div class="mb-3">
              <label for="loginUsername" class="form-label small fw-semibold">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                <input type="text" class="form-control" id="loginUsername" placeholder="e.g. alex" required autocomplete="username">
              </div>
            </div>

            <div class="mb-3">
              <label for="loginPassword" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
              </div>
            </div>

            <button type="submit" id="btnLoginSubmit" class="btn btn-primary w-100 py-2 mb-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
            </button>

            <!-- Quick Demo Button -->
            <button type="button" id="btnQuickDemo" class="btn btn-outline-secondary w-100 py-2 small">
              <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Sign-in (College Presentation)
            </button>
          </form>
        </div>

        <!-- Register Form -->
        <div class="tab-pane fade" id="register-pane" role="tabpanel">
          <form id="registerForm">
            <div class="mb-3">
              <label for="regFullName" class="form-label small fw-semibold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-card-text text-muted"></i></span>
                <input type="text" class="form-control" id="regFullName" placeholder="e.g. Alex Johnson" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="regUsername" class="form-label small fw-semibold">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-at text-muted"></i></span>
                <input type="text" class="form-control" id="regUsername" placeholder="e.g. alexj" required minlength="3">
              </div>
              <div class="form-text small">At least 3 characters.</div>
            </div>

            <div class="mb-3">
              <label for="regPassword" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required minlength="6">
              </div>
              <div class="form-text small">Minimum 6 characters.</div>
            </div>

            <button type="submit" id="btnRegisterSubmit" class="btn btn-primary w-100 py-2 mb-3">
              <i class="bi bi-check-circle me-1"></i> Create Account
            </button>
          </form>
        </div>
      </div>

      <div class="text-center mt-3 pt-3 border-top">
        <small class="text-muted d-block">
          <i class="bi bi-shield-check text-success"></i> Secure password hashing & SQLite database
        </small>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Auth JS -->
  <script src="/js/auth.js"></script>
</body>
</html>
